<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css" />

    <!-- font awesome cdn link for icons -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <h2>Currency Converter</h2>

      <!-- creating a form -->
      <form action="">
        <div class="amount">
          <p>Enter amount</p>
          <input value="100" type="text" />
        </div>
        <!-- for converting from to to -->
        <!-- From container -->
        <div class="dropdown">
          <div class="from">
            <p>From</p>
            <div class="select-container" name="from">
              <img src="https://flagsapi.com/US/flat/64.png" />
              <select name="from" id="">
                <!-- <option value="USD">USD</option>
                <option value="INR">INR</option>
                <option value="NPR">NPR</option>
                <option value="Eur">Eur</option>
                <option value="AUD">AUD</option> -->
              </select>
            </div>
          </div>

          <!-- Exchange icon -->
          <div class="icon">
            <i class="fa-solid fa-arrow-right-arrow-left"></i>
          </div>

          <!-- To container-->

          <div class="To">
            <p>To</p>
            <div class="select-container" name="To">
              <img src="https://flagsapi.com/NP/flat/64.png" />

              <select name="To" id="">
                <!-- <option value="USD">USD</option>
                <option value="INR">INR</option>
                <option value="NPR">NPR</option>
                <option value="Eur">Eur</option>
                <option value="AUD">AUD</option> -->
                <!-- we added the options through JS -->
              </select>
            </div>
          </div>
        </div>

        <!-- message div to display result -->
        <div class="result">Final exchanged amount</div>
        <button>Get exchange rate</button>
      </form>
    </div>
    <script type="module" src="script.js"></script>
    <script src="countryCodes.js"></script>
  </body>
</html>
